<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#10142b">
<title>Hipodrom Analiz</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f5f6fb;
  --card:#fff;
  --text:#15182b;
  --muted:#777c91;
  --primary:#17204a;
  --accent:#b7f000;
  --accent2:#d7ff45;
  --line:#eceef5;
  --shadow:0 12px 35px rgba(20,25,60,.09);
}
body{
  margin:0;background:#dfe2eb;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);min-height:100vh;
}
.app{
  width:100%;max-width:480px;min-height:100vh;margin:auto;background:var(--bg);
  position:relative;overflow:hidden;padding-bottom:92px;
}
.top{
  background:linear-gradient(135deg,#121735 0%,#20295d 100%);
  color:white;padding:25px 20px 28px;border-radius:0 0 30px 30px;
}
.topline{display:flex;align-items:center;justify-content:space-between}
.logo{font-size:22px;font-weight:900;letter-spacing:-.8px}
.logo span{color:var(--accent)}
.icon{
  width:42px;height:42px;border:0;border-radius:14px;background:rgba(255,255,255,.12);
  color:white;font-size:19px;display:grid;place-items:center;
}
.hello{margin-top:25px}
.hello small{opacity:.65;font-size:13px}
.hello h1{margin:4px 0 0;font-size:29px;letter-spacing:-1px}
.search{
  margin-top:22px;background:white;border-radius:17px;height:51px;display:flex;align-items:center;
  padding:0 16px;color:#8c90a0;gap:10px;
}
.search input{border:0;outline:0;width:100%;font-size:14px;background:transparent}
.content{padding:20px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 13px}
.section-head h2{font-size:19px;margin:0;letter-spacing:-.4px}
.section-head a{font-size:12px;font-weight:800;color:#758000;text-decoration:none}
.track{
  display:flex;gap:10px;overflow:auto;padding-bottom:5px;scrollbar-width:none
}
.track::-webkit-scrollbar{display:none}
.track button{
  flex:0 0 auto;border:0;background:white;padding:12px 15px;border-radius:15px;
  font-weight:800;color:#777c91;box-shadow:0 5px 16px rgba(20,25,60,.05)
}
.track button.active{background:var(--accent);color:#11152d}
.race{
  background:var(--card);border-radius:23px;padding:17px;margin:12px 0;box-shadow:var(--shadow);
}
.race-top{display:flex;justify-content:space-between;align-items:flex-start}
.track-name{font-size:18px;font-weight:900}
.race-meta{color:var(--muted);font-size:12px;margin-top:4px}
.badge{background:#edf7c8;color:#5e6d00;border-radius:10px;padding:7px 9px;font-size:11px;font-weight:900}
.horses{display:flex;gap:7px;margin:16px 0}
.horse{
  width:43px;height:43px;border-radius:13px;background:#f1f2f7;display:grid;place-items:center;
  font-weight:900;font-size:14px;color:#4e5369
}
.horse.hot{background:var(--accent);color:#11152d}
.bottom{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  height:78px;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:20;
}
.nav{
  border:0;background:none;color:#9699a8;font-size:10px;font-weight:800;display:flex;
  flex-direction:column;align-items:center;gap:5px;padding:8px 17px
}
.nav i{font-style:normal;font-size:21px}
.nav.active{color:#171d46}
.nav.active i{background:var(--accent);border-radius:12px;padding:5px 10px;margin:-5px -10px 0}
.hero{
  margin-top:18px;border-radius:24px;padding:19px;color:#10142b;
  background:linear-gradient(135deg,#b7f000,#d9ff62);position:relative;overflow:hidden
}
.hero h3{font-size:20px;margin:0 0 5px}
.hero p{margin:0;font-size:12px;opacity:.72;max-width:230px}
.hero button{
  margin-top:14px;border:0;background:#101633;color:white;border-radius:13px;padding:11px 15px;font-weight:800
}
.dot{position:absolute;border-radius:50%;background:rgba(255,255,255,.35)}
.dot.one{width:85px;height:85px;right:-20px;top:-25px}
.dot.two{width:45px;height:45px;right:45px;bottom:-22px}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="topline">
      <div class="logo">HİPODROM<span>+</span></div>
      <button class="icon" onclick="alert('Bildirimler')">♧</button>
    </div>
    <div class="hello">
      <small>BUGÜNÜN YARIŞLARI</small>
      <h1>Hazır mısın? 🏇</h1>
    </div>
    <div class="search">
      🔎 <input id="search" placeholder="Hipodrom veya koşu ara..." oninput="filterRaces()">
    </div>
  </header>

  <main class="content">
    <div class="section-head">
      <h2>Hipodromlar</h2><a href="#">TÜMÜ</a>
    </div>

    <div class="track">
      <button class="active" onclick="selectTrack(this)">Bursa</button>
      <button onclick="selectTrack(this)">İstanbul</button>
      <button onclick="selectTrack(this)">Ankara</button>
      <button onclick="selectTrack(this)">İzmir</button>
      <button onclick="selectTrack(this)">Adana</button>
    </div>

    <div class="hero">
      <h3>Akıllı analiz hazır.</h3>
      <p>İlk 4 adaylarını, puanları ve güçlü tekleri tek ekranda incele.</p>
      <button onclick="showMessage()">Analize Git →</button>
      <span class="dot one"></span><span class="dot two"></span>
    </div>

    <div class="section-head" style="margin-top:25px">
      <h2>Bugünkü Koşular</h2><a href="#">DETAY</a>
    </div>

    <div id="races">
      <article class="race" data-name="Bursa 1. Koşu">
        <div class="race-top">
          <div>
            <div class="track-name">Bursa · 1. Koşu</div>
            <div class="race-meta">13:30 · 1200 m · 6 At</div>
          </div>
          <div class="badge">ANALİZ HAZIR</div>
        </div>
        <div class="horses">
          <div class="horse hot">4</div><div class="horse">2</div><div class="horse">6</div>
          <div class="horse">1</div><div class="horse">5</div><div class="horse">3</div>
        </div>
        <button class="details" onclick="openRace('Bursa 1. Koşu')" style="width:100%;border:0;border-radius:14px;background:#f0f1f6;padding:13px;font-weight:900;color:#1a2047">Koşuyu İncele</button>
      </article>

      <article class="race" data-name="Bursa 2. Koşu">
        <div class="race-top">
          <div>
            <div class="track-name">Bursa · 2. Koşu</div>
            <div class="race-meta">14:00 · 1400 m · 8 At</div>
          </div>
          <div class="badge">TAHMİN</div>
        </div>
        <div class="horses">
          <div class="horse">7</div><div class="horse hot">3</div><div class="horse">1</div>
          <div class="horse">8</div><div class="horse">5</div><div class="horse">2</div>
        </div>
        <button onclick="openRace('Bursa 2. Koşu')" style="width:100%;border:0;border-radius:14px;background:#f0f1f6;padding:13px;font-weight:900;color:#1a2047">Koşuyu İncele</button>
      </article>
    </div>
  </main>

  <nav class="bottom">
    <button class="nav active" onclick="nav(this)"><i>⌂</i>Ana Sayfa</button>
    <button class="nav" onclick="nav(this)"><i>🏇</i>Yarışlar</button>
    <button class="nav" onclick="nav(this)"><i>★</i>Kupon</button>
    <button class="nav" onclick="nav(this)"><i>⚙</i>Ayarlar</button>
  </nav>
</div>

<script>
function selectTrack(el){
  document.querySelectorAll('.track button').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
}
function filterRaces(){
  const q=document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.race').forEach(r=>{
    r.style.display=r.dataset.name.toLowerCase().includes(q)?'block':'none';
  });
}
function openRace(name){
  alert(name + "\\n\\nBuraya gerçek koşu detay ekranını bağlayabiliriz.");
}
function showMessage(){
  alert('Analiz ekranı hazır! Buraya mevcut puanlama sistemini bağlayabiliriz.');
}
function nav(el){
  document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
}
</script>
</body>
</html>
