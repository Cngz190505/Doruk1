<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>İddaa Teknik Analiz</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#667085;--line:#e5e7eb;--accent:#111827;--green:#138a4b;--soft:#f8fafc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent}.app{max-width:720px;margin:0 auto;padding:14px 12px 90px}.top{position:sticky;top:0;z-index:10;background:rgba(244,246,248,.96);backdrop-filter:blur(8px);padding:8px 0 12px}.title{display:flex;align-items:center;gap:9px;font-size:26px;font-weight:800;margin:3px 2px 12px}.cup{font-size:28px}.bar{display:flex;gap:8px;align-items:center}.refresh{border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;padding:12px 15px}.refresh:active{transform:scale(.98)}.auto{font-size:12px;color:var(--muted);line-height:1.25}.status{margin:10px 2px 4px;font-size:14px;font-weight:700}.substatus{font-size:12px;color:var(--muted);margin:0 2px 10px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:5px}.loading{padding:20px;text-align:center;color:var(--muted)}.error{background:#171717;color:#fff;border-radius:12px;padding:13px;margin:12px 0;font-family:monospace;white-space:pre-wrap;word-break:break-word}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0;box-shadow:0 2px 8px rgba(16,24,40,.05);overflow:hidden}.cardhead{padding:13px 14px 10px}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin-bottom:9px}.league{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.teams{font-size:17px;font-weight:800;line-height:1.35}.teamrow{display:flex;justify-content:space-between;gap:10px}.home,.away{max-width:48%}.away{text-align:right}.vs{color:#98a2b3;font-size:12px;font-weight:700;align-self:center}.ms{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.odd{background:var(--soft);border:1px solid var(--line);border-radius:10px;text-align:center;padding:7px 4px}.odd b{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}.odd span{font-size:16px;font-weight:800}.details{border-top:1px solid var(--line)}.fullbtn{width:100%;border:0;background:#fff;text-align:left;padding:13px 14px;font-size:13px;font-weight:800;color:#344054}.fullbtn:disabled{opacity:.65}.fullbox{padding:0 14px 14px}.fullmarkets{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fullmarket{background:#fff}.detailtitle{font-size:12px;font-weight:800;color:#344054;padding:14px 0 8px}details>summary{list-style:none;cursor:pointer;padding:12px 14px;font-size:13px;font-weight:800;color:#344054}details>summary::-webkit-details-marker{display:none}.markets{padding:0 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.market{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff}.marketname{font-size:11px;font-weight:800;color:var(--muted);margin-bottom:7px}.marketvals{display:flex;gap:5px;flex-wrap:wrap}.pill{min-width:54px;background:var(--soft);border-radius:7px;padding:5px 6px;text-align:center;font-size:12px}.pill b{display:block;font-size:10px;color:var(--muted);margin-bottom:2px}.empty{padding:22px;text-align:center;color:var(--muted)}.footer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));text-align:center;font-size:11px;color:var(--muted)}@media(min-width:650px){.app{padding-left:18px;padding-right:18px}.markets{grid-template-columns:repeat(2,1fr)}}

.analysisbox{margin-top:10px;padding:12px;border-top:1px solid #e5e7eb;background:#fafafa}.analysisbtn{width:100%;border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:700;background:#172033;color:#fff}.scoreline{display:flex;gap:8px;margin:10px 0}.score{flex:1;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px;text-align:center}.score b{display:block;font-size:20px}.signal{padding:10px;border-radius:10px;background:#fff;margin-top:8px;font-weight:700}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.stat{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:9px}.stat small{display:block;color:#6b7280}.last5{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.formpill{padding:6px 8px;border-radius:8px;background:#eef2f7;font-weight:700}.marketrow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee}.analysisloading{color:#6b7280;padding:10px 0}
.historytable{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}.historytable th,.historytable td{padding:7px 5px;border-bottom:1px solid #e5e7eb;text-align:left}.historytable th{color:#667085}.green{background:#e7f7ee!important;color:#08783e}.red{background:#fdecec!important;color:#b42318}.yellow{background:#fff7df!important;color:#8a5b00}.badge{display:inline-block;padding:4px 7px;border-radius:7px;font-weight:800}.sectiontitle{font-size:14px;font-weight:800;margin:14px 0 6px}.smallnote{font-size:11px;color:#667085;line-height:1.35}.goalbars{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}.goalbar{font-size:10px;text-align:center}.goalbar i{display:block;height:35px;border-radius:5px;background:#e9eef5;margin-bottom:3px}.oddscompare{overflow:auto}.oddscompare .marketrow{gap:5px}.oddscompare .marketrow span{min-width:0}.strong{font-weight:800}.h2hcard{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:8px;margin-top:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.analysisbox{background:#f8fafc}.analysisbox .stat{font-size:12px}</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="title"><span class="cup">🏆</span><span>İddaa Programı</span></div>
    <div class="bar">
      <button class="refresh" id="refreshBtn" onclick="loadProgram(true)">↻ Şimdi Güncelle</button>
      <div class="auto"><span class="dot"></span>Otomatik güncelleme<br>5 dakikada bir</div>
    </div>
    <div class="status" id="status">Program hazırlanıyor...</div>
    <div class="substatus" id="substatus"></div>
  </div>
  <main id="cards"><div class="loading">Sahadan'dan program çekiliyor...</div></main>
</div>
<div class="footer">Sahadan programı • Sayfa açıkken otomatik yenilenir</div>
<script>
const API='/api/iddaa-program';
const FULL='/api/match-markets?url=';
let busy=false;
const marketOrder=[
 ['IY','İlk Yarı 1 / X / 2'],['Handikap','Handikap H1 / HX / H2'],['KG','Karşılıklı Gol'],['CifteSans','Çifte Şans'],['IY_1_5','İY 1,5 Alt / Üst'],['2_5','2,5 Alt / Üst'],['Ev_1_5','Ev Sahibi 1,5 Alt / Üst'],['Dep_1_5','Deplasman 1,5 Alt / Üst'],['ToplamGol','Toplam Gol']
];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function val(v){return v==null||v===''?'—':String(v)}
function renderMarket(name,title,obj){if(!obj)return '';const labels=Object.keys(obj);return `<div class="market"><div class="marketname">${esc(title)}</div><div class="marketvals">${labels.map(k=>`<div class="pill"><b>${esc(k)}</b>${esc(val(obj[k]))}</div>`).join('')}</div></div>`}
function renderFullMarkets(list){
 if(!Array.isArray(list)||!list.length)return '<div class="empty">Bu maç için ayrıntılı oran bulunamadı.</div>';
 return `<div class="fullmarkets">${list.map(m=>`<div class="market fullmarket"><div class="marketname">${esc(m.name)}</div><div class="marketvals">${(m.options||[]).map(o=>`<div class="pill"><b>${esc(o.label)}</b>${esc(val(o.odds))}</div>`).join('')}</div></div>`).join('')}</div>`;
}
async function loadFullMarkets(btn,url,box,wide){
 if(box.dataset.loaded==='1'){box.hidden=!box.hidden;btn.textContent=box.hidden?'Tüm oranları göster ▾':'Tüm oranları gizle ▲';return;}
 box.hidden=false;
 // Geniş programdaki TÜM sabit marketleri önce hemen göster.
 if(wide&&Object.keys(wide).length){
   const labels={
    MS:'Maç Sonucu',IY:'İlk Yarı Sonucu',Handikap:'Hand. Maç Sonucu',KG:'Karşılıklı Gol',
    CifteSans:'Çifte Şans',IY_1_5:'İY 1,5 Alt/Üst',IlkGol:'İlk Gol',2_5:'2,5 Alt/Üst',
    Ev_1_5:'Ev Sahibi 1,5 Alt/Üst',Dep_1_5:'Deplasman 1,5 Alt/Üst',
    MS_ve_2_5:'MS ve 2,5 Alt/Üst',ToplamGol:'Toplam Gol'
   };
   const html=Object.entries(wide).map(([k,v])=>renderMarket(k,labels[k]||k,v)).join('');
   box.innerHTML='<div class="fullmarkets">'+html+'</div>';
   box.dataset.loaded='1';
   btn.textContent='Tüm oranları gizle ▲';
   // Detay URL varsa arka planda bireysel maç sayfasındaki ek marketleri de getir.
   if(url){
     btn.disabled=true;
     try{
       const r=await fetch(FULL+encodeURIComponent(url),{cache:'no-store'}); if(!r.ok)throw new Error('HTTP '+r.status);
       const d=await r.json(); if(d.ok&&Array.isArray(d.markets)&&d.markets.length){
         box.innerHTML += '<div class="detailtitle">Bireysel maç sayfasındaki ek oranlar</div>'+renderFullMarkets(d.markets);
       }
     }catch(e){ /* geniş program oranları zaten gösterildi; ek detay başarısızsa sessiz kal */ }
     finally{btn.disabled=false;}
   }
   return;
 }
 if(!url){box.innerHTML='<div class="empty">Bu maç için oran bulunamadı.</div>';return;}
 btn.disabled=true;btn.textContent='Tüm oranlar yükleniyor...';
 try{
   const r=await fetch(FULL+encodeURIComponent(url),{cache:'no-store'}); if(!r.ok)throw new Error('HTTP '+r.status);
   const d=await r.json(); if(!d.ok)throw new Error(d.error||'Oranlar alınamadı');
   box.innerHTML=renderFullMarkets(d.markets); box.dataset.loaded='1'; btn.textContent='Tüm oranları gizle ▲';
 }catch(e){box.innerHTML='<div class="error">'+esc(e.name+': '+e.message)+'</div>';btn.textContent='Tekrar dene';}
 finally{btn.disabled=false;}
}
function renderCard(m,i){
 const x=m.markets||{};
 const id='full-'+i, aid='analysis-'+i;
 const wideJson=JSON.stringify(x).replace(/</g,'\\u003c');
 const detailJson=m.detail_url?JSON.stringify(m.detail_url):'null';
 return `<article class="card"><div class="cardhead"><div class="meta"><span class="league">${esc(m.league||'Lig bilgisi yok')}</span><span>${esc(m.time||'')}</span></div><div class="teams"><div class="teamrow"><span class="home">${esc(m.home)}</span><span class="vs">VS</span><span class="away">${esc(m.away)}</span></div></div><div class="ms">${[['1',x.MS?.['1']],['X',x.MS?.['X']],['2',x.MS?.['2']]].map(([k,v])=>`<div class="odd"><b>MS ${k}</b><span>${esc(val(v))}</span></div>`).join('')}</div></div><div class="details"><button class="fullbtn" onclick='loadFullMarkets(this,${detailJson},document.getElementById("${id}"),${wideJson})'>Tüm oranları göster ▾</button><div id="${id}" class="fullbox" hidden></div><button class="analysisbtn" onclick='loadAnalysis(this,${detailJson},document.getElementById("${aid}"))'>⚙ Teknik analiz + geçmiş oran karşılaştırması</button><div id="${aid}" class="analysisbox" hidden></div></div></article>`;
}
async function loadAnalysis(btn,url,box){
  if(!url){box.hidden=false;box.innerHTML='<div class="analysisloading">Bu maç için Sahadan detay adresi bulunamadı.</div>';return;}
  box.hidden=false;btn.disabled=true;btn.textContent='Analiz hazırlanıyor...';box.innerHTML='<div class="analysisloading">Son 5 maç, H2H, gol dakikaları ve geçmiş oranlar karşılaştırılıyor...</div>';
  try{
    const r=await fetch('/api/technical-analysis?url='+encodeURIComponent(url),{cache:'no-store'}); if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json(); if(!d.ok)throw new Error(d.error||'Analiz alınamadı');
    const p=d.prediction||{}, h=d.home||{}, a=d.away||{};
    const s=(o,k)=>o&&o[k]!=null?o[k]:'-';
    const pills=xs=>(xs||[]).map(x=>`<span class="formpill">${esc(x.result)} ${esc(x.score)}</span>`).join('');
    const teamStats=(name,z)=>`<div class="stat"><b>${esc(name)}</b><div class="last5">${pills(z.last5)}</div><div class="statgrid"><div><small>Attığı</small><b>${s(z.details,'avg_gf')}</b></div><div><small>Yediği</small><b>${s(z.details,'avg_ga')}</b></div><div><small>Son 5 KG Var</small><b>${s(z.details,'last5_btts_pct')}%</b></div><div><small>Son 5 Üst 2,5</small><b>${s(z.details,'last5_over25_pct')}%</b></div><div><small>Son 5 İY gol</small><b>${s(z.details,'last5_ht_goal_pct')}%</b></div><div><small>Geriden çevirme</small><b>${s(z.details,'last5_comeback_win')}/${s(z.details,'last5_comeback')}</b></div></div></div>`;
    const rows=(d.historical_market_comparison||[]).slice().sort((x,y)=>((y.edge_pct??-999)-(x.edge_pct??-999))).map(x=>{
      const cls=x.signal||'yellow';
      return `<div class="marketrow ${cls}"><span><b>${esc(x.market)}</b> — ${esc(x.option)}</span><span>Güncel <b>${x.current_odds}</b></span><span>Geçmiş ort. ${x.historical_avg_odds??'—'}</span><span>Başarı ${x.historical_hit_rate??'—'}%</span><span>Pay ${x.current_implied_pct??'—'}%</span></div>`;
    }).join('');
    const h2h=(d.h2h_last5||[]).map(x=>`<div class="h2hcard"><b>${esc(x.score)}</b> <span class="smallnote">${esc(x.date||'')}</span></div>`).join('')||'<div class="smallnote">H2H son 5 verisi bulunamadı.</div>';
    const greens=(d.green_signals||[]).map(x=>`<span class="badge green">${esc(x.market)} ${esc(x.option)} · ${x.current_odds}</span>`).join(' ')||'<span class="smallnote">Yeterli geçmiş örnek yok.</span>';
    const gm=(z)=>Object.entries(z.stats?.goal_minutes||{}).map(([k,v])=>`<div class="goalbar"><i title="${v.scored||0} attı / ${v.conceded||0} yedi" style="height:${Math.min(80,18+(v.scored||0)*10)}px"></i>${esc(k)}<br><b>${v.scored||0}/${v.conceded||0}</b></div>`).join('');
    box.innerHTML=`<div class="sectiontitle">Sistem skoru</div><div class="scoreline"><div class="score"><small>${esc(d.match.home)}</small><b>${p.home_score??'-'}</b><span>puan</span></div><div class="score"><small>${esc(d.match.away)}</small><b>${p.away_score??'-'}</b><span>puan</span></div></div><div class="signal">MS: <b>${esc(p.result_signal||'-')}</b> · Gol: <b>${esc(p.goal_signal||'-')}</b></div>
      <div class="sectiontitle">Takımların son 5 maçı</div><div class="two">${teamStats(d.match.home,h)}${teamStats(d.match.away,a)}</div>
      <div class="sectiontitle">Gol dakikaları — atılan / yenilen</div><div class="two"><div class="stat"><b>${esc(d.match.home)}</b><div class="goalbars">${gm(h)||'-'}</div></div><div class="stat"><b>${esc(d.match.away)}</b><div class="goalbars">${gm(a)||'-'}</div></div></div>
      <div class="sectiontitle">İki takımın son 5 karşılaşması</div>${h2h}
      <div class="sectiontitle">🟢 Geçmiş veriye göre olumlu oranlar</div><div>${greens}</div>
      <div class="sectiontitle">Güncel oran ↔ geçmiş oran ↔ gerçekleşme</div><div class="smallnote">Yeşil: geçmiş gerçekleşme oranı, güncel oranın ima ettiği olasılıktan en az 5 puan yüksek. Kırmızı tersi. Sarı: sınırda veya örnek az.</div><div class="oddscompare">${rows||'<div class="smallnote">Karşılaştırılabilir geçmiş oran bulunamadı.</div>'}</div>
      <div class="smallnote" style="margin-top:8px">Kullanılan geçmiş maç sayısı: ${d.history_matches_used||0}. Geçmiş oran Sahadan sayfasında bulunmuyorsa sistem tahmin uydurmaz; “—” gösterir.</div>`;
    btn.textContent='Teknik analizi yenile ↻';
  }catch(e){box.innerHTML='<div class="analysisloading">Hata: '+esc(e.name+': '+e.message)+'</div>';btn.textContent='Teknik analizi tekrar dene';}
  btn.disabled=false;
}

async function loadProgram(manual=false){if(busy)return;busy=true;const status=document.getElementById('status'),sub=document.getElementById('substatus'),cards=document.getElementById('cards'),btn=document.getElementById('refreshBtn');if(manual)btn.disabled=true;status.textContent='Sahadan\'dan program çekiliyor...';sub.textContent='';try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();if(!d.ok)throw new Error(d.error||'Bilinmeyen backend hatası');status.innerHTML='<span class="dot"></span>'+d.count+' maç yüklendi';sub.textContent='Son güncelleme: '+new Date(d.fetched_at).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});cards.innerHTML=d.matches?.length?d.matches.map((m,i)=>renderCard(m,i)).join(''):'<div class="empty">Programda maç bulunamadı.</div>';}catch(e){status.textContent='Veri alınamadı';sub.textContent='Tekrar deneniyor...';cards.innerHTML='<div class="error">'+esc(e.name+': '+e.message)+'</div>';}finally{busy=false;btn.disabled=false}}
loadProgram();
setInterval(()=>loadProgram(false),5*60*1000);
</script>
</body>
</html>
