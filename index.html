<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>İddaa Programı</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --accent: #ffb020;
    --text: #f2f2f2;
    --muted: #9aa0aa;
    --border: #2a2e37;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 40px;
  }
  header {
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: 16px;
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }
  h1 {
    margin: 0;
    font-size: 20px;
  }
  .status {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  #refreshBtn {
    background: var(--accent);
    color: #111;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-weight: 600;
    margin-top: 10px;
  }
  .match-card {
    background: var(--card);
    margin: 10px 14px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  .match-time {
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
  }
  .teams {
    font-size: 15px;
    margin: 6px 0;
  }
  .odds {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 13px;
    color: var(--muted);
  }
  .odds span {
    background: #22262f;
    padding: 3px 8px;
    border-radius: 6px;
  }
  .loading, .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
  }
</style>
</head>
<body>
  <header>
    <h1>İddaa Programı</h1>
    <div class="status" id="status">Yükleniyor...</div>
    <button id="refreshBtn">Yenile</button>
  </header>

  <div id="list"></div>

  <script>
    const listEl = document.getElementById("list");
    const statusEl = document.getElementById("status");
    const refreshBtn = document.getElementById("refreshBtn");

    // Backend farkli bir adreste calisiyorsa burayi degistir
    const API_URL = "/api/iddaa-programi";

    async function loadMatches() {
      statusEl.textContent = "Yükleniyor...";
      listEl.innerHTML = '<div class="loading">Maçlar getiriliyor...</div>';

      try {
        const res = await fetch(API_URL);
        const data = await res.json();

        if (!data.matches || data.matches.length === 0) {
          listEl.innerHTML = '<div class="empty">Maç bulunamadı. Backend selector\'ları güncellemen gerekebilir.</div>';
          statusEl.textContent = "Veri yok";
          return;
        }

        statusEl.textContent = `${data.matches.length} maç • ${new Date(data.fetchedAt).toLocaleTimeString("tr-TR")}`;
        listEl.innerHTML = "";

        data.matches.forEach((m) => {
          const card = document.createElement("div");
          card.className = "match-card";
          // Backend henüz ham hücre (raw) döndürüyor; parse tamamlanınca
          // burada m.time, m.home, m.away, m.odds gibi alanlar kullanılacak.
          card.innerHTML = `<div class="teams">${(m.raw || []).join(" — ")}</div>`;
          listEl.appendChild(card);
        });
      } catch (err) {
        statusEl.textContent = "Hata oluştu";
        listEl.innerHTML = `<div class="empty">Veri alınamadı: ${err.message}</div>`;
      }
    }

    refreshBtn.addEventListener("click", loadMatches);
    loadMatches();
  </script>
</body>
</html>
