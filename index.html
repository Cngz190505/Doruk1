<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>İddaa Programı</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#667085;--line:#e5e7eb;--accent:#111827;--green:#138a4b;--soft:#f8fafc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent}.app{max-width:720px;margin:0 auto;padding:14px 12px 90px}.top{position:sticky;top:0;z-index:10;background:rgba(244,246,248,.96);backdrop-filter:blur(8px);padding:8px 0 12px}.title{display:flex;align-items:center;gap:9px;font-size:26px;font-weight:800;margin:3px 2px 12px}.cup{font-size:28px}.bar{display:flex;gap:8px;align-items:center}.refresh{border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;padding:12px 15px}.refresh:active{transform:scale(.98)}.auto{font-size:12px;color:var(--muted);line-height:1.25}.status{margin:10px 2px 4px;font-size:14px;font-weight:700}.substatus{font-size:12px;color:var(--muted);margin:0 2px 10px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:5px}.loading{padding:20px;text-align:center;color:var(--muted)}.error{background:#171717;color:#fff;border-radius:12px;padding:13px;margin:12px 0;font-family:monospace;white-space:pre-wrap;word-break:break-word}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0;box-shadow:0 2px 8px rgba(16,24,40,.05);overflow:hidden}.cardhead{padding:13px 14px 10px}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin-bottom:9px}.league{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.teams{font-size:17px;font-weight:800;line-height:1.35}.teamrow{display:flex;justify-content:space-between;gap:10px}.home,.away{max-width:48%}.away{text-align:right}.vs{color:#98a2b3;font-size:12px;font-weight:700;align-self:center}.ms{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.odd{background:var(--soft);border:1px solid var(--line);border-radius:10px;text-align:center;padding:7px 4px}.odd b{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}.odd span{font-size:16px;font-weight:800}.details{border-top:1px solid var(--line)}details>summary{list-style:none;cursor:pointer;padding:12px 14px;font-size:13px;font-weight:800;color:#344054}details>summary::-webkit-details-marker{display:none}.markets{padding:0 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.market{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff}.marketname{font-size:11px;font-weight:800;color:var(--muted);margin-bottom:7px}.marketvals{display:flex;gap:5px;flex-wrap:wrap}.pill{min-width:54px;background:var(--soft);border-radius:7px;padding:5px 6px;text-align:center;font-size:12px}.pill b{display:block;font-size:10px;color:var(--muted);margin-bottom:2px}.empty{padding:22px;text-align:center;color:var(--muted)}.footer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));text-align:center;font-size:11px;color:var(--muted)}@media(min-width:650px){.app{padding-left:18px;padding-right:18px}.markets{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="title"><span class="cup">🏆</span><span>İddaa Programı</span></div>
    <div class="bar">
      <button class="refresh" id="refreshBtn" onclick="loadProgram(true)">↻ Şimdi Güncelle</button>
      <div class="auto"><span class="dot"></span>Otomatik güncelleme<br>5 dakikada bir</div>
    </div>
    <div class="status" id="status">Program hazırlanıyor...</div>
    <div class="substatus" id="substatus"></div>
  </div>
  <main id="cards"><div class="loading">Sahadan'dan program çekiliyor...</div></main>
</div>
<div class="footer">Sahadan programı • Sayfa açıkken otomatik yenilenir</div>
<script>
const API='/api/iddaa-program';
let busy=false;
const marketOrder=[
 ['IY','İlk Yarı 1 / X / 2'],['Handikap','Handikap H1 / HX / H2'],['KG','Karşılıklı Gol'],['CifteSans','Çifte Şans'],['IY_1_5','İY 1,5 Alt / Üst'],['2_5','2,5 Alt / Üst'],['Ev_1_5','Ev Sahibi 1,5 Alt / Üst'],['Dep_1_5','Deplasman 1,5 Alt / Üst'],['ToplamGol','Toplam Gol']
];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function val(v){return v==null||v===''?'—':String(v)}
function renderMarket(name,title,obj){if(!obj)return '';const labels=Object.keys(obj);return `<div class="market"><div class="marketname">${esc(title)}</div><div class="marketvals">${labels.map(k=>`<div class="pill"><b>${esc(k)}</b>${esc(val(obj[k]))}</div>`).join('')}</div></div>`}
function renderCard(m){const x=m.markets||{};return `<article class="card"><div class="cardhead"><div class="meta"><span class="league">${esc(m.league||'Lig bilgisi yok')}</span><span>${esc(m.time||'')}</span></div><div class="teams"><div class="teamrow"><span class="home">${esc(m.home)}</span><span class="vs">VS</span><span class="away">${esc(m.away)}</span></div></div><div class="ms">${[['1',x.MS?.['1']],['X',x.MS?.['X']],['2',x.MS?.['2']]].map(([k,v])=>`<div class="odd"><b>MS ${k}</b><span>${esc(val(v))}</span></div>`).join('')}</div></div><div class="details"><details><summary>Diğer oranları göster ▾</summary><div class="markets">${marketOrder.map(([n,t])=>renderMarket(n,t,x[n])).join('')}</div></details></div></article>`}
async function loadProgram(manual=false){if(busy)return;busy=true;const status=document.getElementById('status'),sub=document.getElementById('substatus'),cards=document.getElementById('cards'),btn=document.getElementById('refreshBtn');if(manual)btn.disabled=true;status.textContent='Sahadan\'dan program çekiliyor...';sub.textContent='';try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();if(!d.ok)throw new Error(d.error||'Bilinmeyen backend hatası');status.innerHTML='<span class="dot"></span>'+d.count+' maç yüklendi';sub.textContent='Son güncelleme: '+new Date(d.fetched_at).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});cards.innerHTML=d.matches?.length?d.matches.map(renderCard).join(''):'<div class="empty">Programda maç bulunamadı.</div>';}catch(e){status.textContent='Veri alınamadı';sub.textContent='Tekrar deneniyor...';cards.innerHTML='<div class="error">'+esc(e.name+': '+e.message)+'</div>';}finally{busy=false;btn.disabled=false}}
loadProgram();
setInterval(()=>loadProgram(false),5*60*1000);
</script>
</body>
</html>
