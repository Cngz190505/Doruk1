<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><title>İddaa Teknik Analiz</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#667085;--line:#e5e7eb;--dark:#111827;--green:#e8f7ee;--gtext:#08783e;--red:#fdecec;--rtext:#b42318;--yellow:#fff7df;--ytext:#8a5b00}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}.app{max-width:760px;margin:auto;padding:12px 12px 80px}.top{position:sticky;top:0;z-index:20;background:rgba(244,246,248,.96);backdrop-filter:blur(10px);padding:6px 0 10px}.title{font-size:25px;font-weight:900;margin:5px 2px 3px}.sub{font-size:12px;color:var(--muted);margin:0 2px 10px}.bar{display:flex;gap:8px}.btn{border:0;border-radius:12px;background:var(--dark);color:#fff;font-weight:800;padding:11px 14px}.status{font-size:13px;font-weight:800;margin:9px 2px 2px}.progress{height:7px;background:#e5e7eb;border-radius:9px;overflow:hidden;margin:7px 2px}.progress i{display:block;height:100%;width:0;background:#111827;transition:width .3s}.note{font-size:11px;color:var(--muted);margin:5px 2px 10px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;margin:9px 0;overflow:hidden}.head{padding:12px 13px}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.teams{font-size:16px;font-weight:900;margin-top:7px}.ms{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.odd{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:7px;text-align:center}.odd small{display:block;color:var(--muted);font-size:10px}.odd b{font-size:15px}.result{display:flex;gap:7px;align-items:center;margin-top:9px;flex-wrap:wrap}.badge{display:inline-block;border-radius:8px;padding:6px 8px;font-size:11px;font-weight:900}.green{background:var(--green);color:var(--gtext)}.red{background:var(--red);color:var(--rtext)}.yellow{background:var(--yellow);color:var(--ytext)}.dark{background:#eef1f5;color:#263244}.body{border-top:1px solid var(--line);padding:11px 13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}.stat small{display:block;color:var(--muted);font-size:10px}.stat b{font-size:13px}.section{font-size:12px;font-weight:900;margin:12px 0 6px}.form{display:flex;gap:4px;flex-wrap:wrap}.fp{background:#eef2f7;border-radius:7px;padding:5px 7px;font-size:10px;font-weight:800}.signal{padding:7px;border-radius:8px;margin:4px 0;font-size:11px;font-weight:800}.market{border:1px solid var(--line);border-radius:9px;padding:8px;margin:5px 0}.marketname{font-size:10px;color:var(--muted);font-weight:900;margin-bottom:5px}.pills{display:flex;gap:5px;flex-wrap:wrap}.pill{background:#f8fafc;border-radius:6px;padding:5px 7px;font-size:10px}.pill b{margin-right:4px}.comp{overflow:auto}.row{display:grid;grid-template-columns:1.3fr .6fr .7fr .7fr .5fr;gap:5px;padding:6px 4px;border-bottom:1px solid var(--line);font-size:9px;min-width:500px}.row.headrow{font-weight:900;color:var(--muted)}.empty,.loading,.error{padding:18px;text-align:center;color:var(--muted)}.error{color:#b42318}.footer{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:8px;text-align:center;font-size:10px;color:var(--muted);z-index:30}
</style></head><body><div class="app"><div class="top"><div class="title">🏆 İddaa Teknik Analiz</div><div class="sub">Sahadan programı • güncel oran • son 5 • H2H • geçmiş oran karşılaştırması</div><div class="bar"><button class="btn" onclick="start(true)">↻ Yenile ve Analiz Et</button></div><div id="status" class="status">Program yükleniyor...</div><div class="progress"><i id="bar"></i></div><div id="note" class="note"></div></div><main id="list"><div class="loading">Sahadan'dan program çekiliyor...</div></main></div><div class="footer">Analiz sonuçları veri bulunan maçlarda otomatik hesaplanır; veri yoksa tahmin uydurulmaz.</div>
<script>
let matches=[];let poll=null;let running=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const val=x=>(x==null||x==='')?'—':x;
function setStatus(t,note=''){ $('status').textContent=t;$('note').textContent=note; }
function signalClass(s){return s==='green'?'green':s==='red'?'red':'yellow'}
function ms(m){let x=m.markets?.MS||{};return [['1',x['1']],['X',x['X']],['2',x['2']]].map(a=>`<div class="odd"><small>MS ${a[0]}</small><b>${esc(val(a[1]))}</b></div>`).join('')}
function forms(z){return (z||[]).map(x=>`<span class="fp">${esc(x.result)} ${esc(x.score)}</span>`).join('')||'<span class="note">Veri yok</span>'}
function markets(list){return (list||[]).slice(0,18).map(m=>`<div class="market"><div class="marketname">${esc(m.name)}</div><div class="pills">${(m.options||[]).map(o=>`<span class="pill"><b>${esc(o.label)}</b>${esc(val(o.odds))}</span>`).join('')}</div></div>`).join('')}
function comparisons(list){let a=(list||[]).slice().sort((x,y)=>(y.edge_pct??-999)-(x.edge_pct??-999));if(!a.length)return '<div class="note">Karşılaştırılabilir geçmiş oran bulunamadı.</div>';return `<div class="comp"><div class="row headrow"><span>Market</span><span>Güncel</span><span>Geçmiş</span><span>Başarı</span><span>Edge</span></div>${a.slice(0,30).map(x=>`<div class="row ${signalClass(x.signal)}"><span>${esc(x.market)} / ${esc(x.option)}</span><span>${val(x.current_odds)}</span><span>${val(x.historical_avg_odds)}</span><span>${val(x.historical_hit_rate)}%</span><span>${val(x.edge_pct)}</span></div>`).join('')}</div>`}
function card(r,i){let p=r.prediction||{},h=r.home||{},a=r.away||{},hd=h.details||{},ad=a.details||{}, greens=r.green_signals||[];let score=`${val(p.home_score)} - ${val(p.away_score)}`;let cls=Math.abs(Number(p.edge||0))<7?'yellow':'green';return `<article class="card"><div class="head"><div class="meta"><span>${esc(matches[i]?.league||'')}</span><span>${esc(matches[i]?.time||'')}</span></div><div class="teams">${esc(r.match?.home||matches[i]?.home||'')} — ${esc(r.match?.away||matches[i]?.away||'')}</div><div class="ms">${ms(matches[i]||{})}</div><div class="result"><span class="badge ${cls}">Sistem ${esc(score)}</span><span class="badge dark">${esc(p.result_signal||'—')}</span><span class="badge dark">${esc(p.goal_signal||'—')}</span></div></div><div class="body"><div class="section">Son 5 form</div><div class="grid"><div class="stat"><small>${esc(r.match?.home||'Ev')}</small><div class="form">${forms(h.last5)}</div></div><div class="stat"><small>${esc(r.match?.away||'Dep')}</small><div class="form">${forms(a.last5)}</div></div></div><div class="section">Temel göstergeler</div><div class="grid"><div class="stat"><small>Ev — attığı / yediği</small><b>${val(hd.avg_gf)} / ${val(hd.avg_ga)}</b></div><div class="stat"><small>Dep — attığı / yediği</small><b>${val(ad.avg_gf)} / ${val(ad.avg_ga)}</b></div><div class="stat"><small>Ev KG / Ü2,5</small><b>${val(hd.last5_btts_pct)}% / ${val(hd.last5_over25_pct)}%</b></div><div class="stat"><small>Dep KG / Ü2,5</small><b>${val(ad.last5_btts_pct)}% / ${val(ad.last5_over25_pct)}%</b></div><div class="stat"><small>Ev geriden çevirme</small><b>${val(hd.last5_comeback_win)}/${val(hd.last5_comeback)}</b></div><div class="stat"><small>Dep geriden çevirme</small><b>${val(ad.last5_comeback_win)}/${val(ad.last5_comeback)}</b></div></div><div class="section">🟢 En güçlü geçmiş oran sinyalleri</div>${greens.length?greens.map(x=>`<div class="signal green">${esc(x.market)} / ${esc(x.option)} • Güncel ${val(x.current_odds)} • Başarı ${val(x.historical_hit_rate)}% • Edge ${val(x.edge_pct)}</div>`).join(''):'<div class="note">Yeterli geçmiş örnek yok.</div>'}<details><summary class="section">H2H son 5 ve oran detayları</summary><div class="section">H2H</div>${(r.h2h_last5||[]).map(x=>`<div class="signal dark">${esc(x.date||'')} ${esc(x.score)}</div>`).join('')||'<div class="note">H2H bulunamadı.</div>'}<div class="section">Güncel marketler</div>${markets(r.current_markets)}<div class="section">Güncel ↔ geçmiş oran karşılaştırması</div>${comparisons(r.historical_market_comparison)}<div class="note">Geçmiş kullanılan maç sayısı: ${val(r.history_matches_used)}</div></details></div></article>`}
function render(results){let map=new Map((results||[]).map(r=>[(r.match?.detail_url||'') ,r]));let html='';matches.forEach((m,i)=>{let r=map.get(m.detail_url||'');if(r)html+=card(r,i);else html+=`<article class="card"><div class="head"><div class="meta"><span>${esc(m.league||'')}</span><span>${esc(m.time||'')}</span></div><div class="teams">${esc(m.home)} — ${esc(m.away)}</div><div class="ms">${ms(m)}</div></div><div class="body"><div class="note">Bu maç henüz analiz kuyruğunda veya veri alınamadı.</div></div></article>`});$('list').innerHTML=html||'<div class="empty">Maç bulunamadı.</div>'}
async function getProgram(){let r=await fetch('/api/iddaa-program',{cache:'no-store'});if(!r.ok)throw Error('Program HTTP '+r.status);let d=await r.json();if(!d.ok)throw Error(d.error||'Program alınamadı');matches=d.matches||[];setStatus(`${matches.length} maç yüklendi`,`Kaynak: ${d.source||'Sahadan'} • analiz başlatılıyor`);render([])}
async function start(manual=false){if(running)return;running=true;clearInterval(poll);try{await getProgram();let r=await fetch('/api/analyze-all',{cache:'no-store'});if(!r.ok)throw Error('Analiz başlatılamadı: HTTP '+r.status);let d=await r.json();setStatus(`Toplu teknik analiz başlatıldı: 0 / ${d.total||matches.length}`);poll=setInterval(status,4000);await status()}catch(e){$('list').innerHTML=`<div class="error">${esc(e.message)}</div>`;setStatus('Hata',e.message);running=false}}
async function status(){try{let r=await fetch('/api/analyze-all/status',{cache:'no-store'});let d=await r.json();let total=d.total||matches.length,done=d.done||0;$('bar').style.width=(total?Math.round(done/total*100):0)+'%';setStatus(d.state==='done'?`Analiz tamamlandı: ${done} / ${total}`:`Teknik analiz ilerliyor: ${done} / ${total}`,d.errors?.length?`${d.errors.length} maçta veri alınamadı; diğerleri devam ediyor.`:'Sonuçlar geldikçe ekranda güncelleniyor.');render(d.results||[]);if(d.state==='done'){clearInterval(poll);running=false}}catch(e){setStatus('Analiz durumu alınamadı',e.message)}}
start();
</script></body></html>
