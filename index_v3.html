<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>İddaa Programı</title>
<style>
body{font-family:Arial,sans-serif;margin:20px;padding:0;background:#fafafa;color:#111}
.wrap{max-width:1400px;margin:auto}button{padding:12px 18px;font-size:16px;cursor:pointer}#status{margin-top:12px;font-weight:bold}.table-wrap{overflow:auto;margin-top:18px;background:#fff}table{width:100%;border-collapse:collapse;min-width:1200px}th,td{border:1px solid #ddd;padding:7px;text-align:center;white-space:nowrap}th{background:#f0f0f0;position:sticky;top:0}.team{text-align:left}.market{font-size:12px}.ok{font-weight:bold}pre{white-space:pre-wrap;background:#111;color:#eee;padding:12px;border-radius:8px}
</style>
</head>
<body><div class="wrap">
<h2>🏆 İddaa Programı</h2>
<button onclick="loadProgram()">Programı Çek</button>
<div id="status">Hazır</div>
<div class="table-wrap"><table><thead><tr>
<th>Saat</th><th>Lig</th><th>Ev Sahibi</th><th>Deplasman</th>
<th>MS 1</th><th>MS X</th><th>MS 2</th>
<th>İY 1</th><th>İY X</th><th>İY 2</th>
<th>H1</th><th>HX</th><th>H2</th><th>KG Var</th><th>KG Yok</th>
<th>ÇŞ 1X</th><th>ÇŞ 12</th><th>ÇŞ X2</th><th>İY1,5 Alt</th><th>İY1,5 Üst</th>
<th>2,5 Alt</th><th>2,5 Üst</th><th>Ev1,5 Alt</th><th>Ev1,5 Üst</th>
<th>Dep1,5 Alt</th><th>Dep1,5 Üst</th><th>0-1</th><th>2-3</th><th>4-5</th><th>6+</th>
</tr></thead><tbody id="rows"></tbody></table></div><pre id="raw"></pre>
</div>
<script>
async function loadProgram(){
 const status=document.getElementById('status'),rows=document.getElementById('rows'),raw=document.getElementById('raw');
 status.textContent='Sahadan\'dan program çekiliyor...';rows.innerHTML='';raw.textContent='';
 try{const r=await fetch('https://doruk1-1.onrender.com/api/iddaa-program');const d=await r.json();
  if(!d.ok){status.textContent='Hata: '+d.error;raw.textContent=JSON.stringify(d,null,2);return;}
  status.textContent='Toplam '+d.count+' maç bulundu. Kaynak: '+d.source;
  for(const m of d.matches){const x=m.markets||{};const vals=[x.MS,x.IY,x.Handikap,x.KG,x.CifteSans,x.IY_1_5,x['2_5'],x.Ev_1_5,x.Dep_1_5,x.ToplamGol];
   const flat=[];for(const g of vals)if(g)for(const k of Object.keys(g))flat.push(g[k]);
   const tr=document.createElement('tr');
   const cells=[m.time,m.league,m.home,m.away,...flat];
   tr.innerHTML=cells.map((v,i)=>'<td class="'+(i<4?'team':'market')+'">'+esc(v??'—')+'</td>').join('');rows.appendChild(tr);
  }
  if(!d.count)raw.textContent=JSON.stringify(d,null,2);
 }catch(e){status.textContent='Backend\'e ulaşılamadı';raw.textContent=String(e)}
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
</script></body></html>
